name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

env:
  IMAGE_NAME: ghcr.io/${{ toLower(github.repository) }}

jobs:
  lint_unit_integration:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static analysis (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest tests/unit --cov=app --cov-report=xml

      - name: Install postgres client (pg_isready)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U app -d app && exit 0
            sleep 1
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Integration tests (Postgres)
        env:
            DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
        run: pytest tests/integration -m integration

  docker_acceptance:
    runs-on: ubuntu-latest
    needs: lint_unit_integration
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local load)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test-${{ github.sha }}

      - name: Run container for acceptance tests
        run: |
          docker run -d --name app -p 8000:8000 ${{ env.IMAGE_NAME }}:test-${{ github.sha }}
          pytest tests/acceptance -m acceptance

      - name: Cleanup
        if: always()
        run: docker rm -f app || true

  push_ghcr:
    runs-on: ubuntu-latest
    needs: docker_acceptance
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  create_issue_on_failure:
    runs-on: ubuntu-latest
    needs: [lint_unit_integration, docker_acceptance, push_ghcr]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Prepare issue body
        run: |
          mkdir -p .github
          {
            echo "## CI failure on main"
            echo ""
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run URL: ${{ github.server_url }}/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Please check logs in the Actions run and fix the failing step(s)."
          } > .github/ci-failure.md

      - name: Create GitHub Issue
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: "CI failed on main: ${{ github.sha }}"
          content-filepath: .github/ci-failure.md
          labels: ci-failure

  slack_notify:
    runs-on: ubuntu-latest
    needs: [lint_unit_integration, docker_acceptance, push_ghcr]
    if: always()

    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*CI result*: ${{ github.repository }} @ ${{ github.ref }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*CI result:* `${{ needs.lint_unit_integration.result }}` → `${{ needs.docker_acceptance.result }}` → `${{ needs.push_ghcr.result }}'"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
